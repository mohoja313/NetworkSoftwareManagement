server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8099}

spring:
  application:
    name: network-software-management
  datasource:
    url: jdbc:h2:file:${DATA_PATH:./data}/nsm;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MAX_FILE_SIZE:2GB}
      max-request-size: ${APP_MAX_FILE_SIZE:2GB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@example.com}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  storage-path: ${STORAGE_PATH:./data/storage}
  max-file-size: 2147483648 # 2 GiB (overridable via APP_MAX_BYTES)
  max-icon-size: 5242880    # 5 MiB
  otp:
    ttl-minutes: 10
    max-attempts: 5
    request-cooldown-seconds: 60
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-change-me-please-set-APP_JWT_SECRET}
    ttl-days: 30
  mail:
    from: ${MAIL_FROM:noreply@example.com}

logging:
  level:
    com.networksoftware: INFO
